<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Notes & Todo App - Web Storage</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #a855f7;
            --input-bg: #0b1120;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --purple: #9333ea;
            --input-bg: #f8fafc;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 820px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
            font-weight: 500;
            border-radius: 6px;
            padding: 8px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary { background: var(--accent); color: #ffffff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); }
        .btn-secondary:hover { border-color: var(--accent); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--danger); color: #ffffff; }
        .btn-edit { background: rgba(168, 85, 247, 0.15); color: var(--purple); border: 1px solid rgba(168, 85, 247, 0.3); }
        .btn-edit:hover { background: var(--purple); color: #ffffff; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .note-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea, input[type="text"], select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px 14px;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }

        textarea:focus, input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1 1 200px;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
        }

        .tag-pill {
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 999px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            cursor: pointer;
        }

        .tag-pill.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: var(--shadow);
            cursor: grab;
            position: relative;
        }

        .note-item.dragging {
            opacity: 0.4;
            border-style: dashed;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 12px;
        }

        .note-category-badge {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .note-content {
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-item.completed .note-content {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .note-timestamps {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .note-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            border: 2px dashed var(--card-border);
            border-radius: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>📝 Notes & Todo App</h1>
        <div class="header-actions">
            <button class="btn-secondary" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓 Theme</button>
            <button class="btn-secondary" onclick="exportNotes()" title="Export notes as JSON">📥 Export JSON</button>
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()" title="Import notes from JSON">📤 Import JSON</button>
            <input type="file" id="fileInput" accept=".json" onchange="importNotes(event)">
        </div>
    </header>

    <!-- Create Note -->
    <div class="card">
        <form class="note-form" onsubmit="handleFormSubmit(event)">
            <textarea id="noteInput" placeholder="What's on your mind? (Required)" required></textarea>
            <div class="form-row">
                <select id="categorySelect" style="max-width: 180px;">
                    <option value="General">🏷️ General</option>
                    <option value="Work">💼 Work</option>
                    <option value="Personal">🏡 Personal</option>
                    <option value="Ideas">💡 Ideas</option>
                    <option value="Study">📚 Study</option>
                </select>
                <button type="submit" class="btn-primary" style="margin-left: auto;">➕ Add Note</button>
            </div>
        </form>
    </div>

    <!-- Controls -->
    <div class="card">
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search notes..." oninput="handleSearch()">
            </div>
            <div class="filter-tags">
                <button class="tag-pill active" onclick="setFilter('all', this)">All</button>
                <button class="tag-pill" onclick="setFilter('active', this)">Active</button>
                <button class="tag-pill" onclick="setFilter('completed', this)">Completed</button>
            </div>
        </div>
    </div>

    <!-- Notes List -->
    <div class="notes-list" id="notesList"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3>Edit Note</h3>
        <textarea id="editModalInput" rows="5"></textarea>
        <select id="editModalCategory">
            <option value="General">🏷️ General</option>
            <option value="Work">💼 Work</option>
            <option value="Personal">🏡 Personal</option>
            <option value="Ideas">💡 Ideas</option>
            <option value="Study">📚 Study</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
            <button class="btn-primary" onclick="saveEditedNote()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'notes';
    const THEME_KEY = 'theme_preference';

    let currentFilter = 'all';
    let searchQuery = '';
    let editingNoteId = null;
    let draggedItemIndex = null;

    /* LocalStorage Helpers */
    function getNotes() {
        const raw = localStorage.getItem(STORAGE_KEY);
        try {
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            console.error("Failed to parse notes:", e);
            return [];
        }
    }

    function saveNotes(notes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    /* CRUD Operations */
    function addNote(text, category = 'General') {
        const trimmed = text.trim();
        if (!trimmed) return alert("Note cannot be empty!");

        const notes = getNotes();
        notes.unshift({
            id: Date.now(),
            text: trimmed,
            category: category,
            completed: false,
            createdAt: new Date().toISOString(),
            updatedAt: null
        });

        saveNotes(notes);
        renderNotes();
    }

    function updateNote(id, newText, newCategory) {
        const notes = getNotes();
        const note = notes.find(n => n.id === id);
        if (note) {
            note.text = newText.trim();
            if (newCategory) note.category = newCategory;
            note.updatedAt = new Date().toISOString();
            saveNotes(notes);
            renderNotes();
        }
    }

    function toggleComplete(id) {
        const notes = getNotes();
        const note = notes.find(n => n.id === id);
        if (note) {
            note.completed = !note.completed;
            note.updatedAt = new Date().toISOString();
            saveNotes(notes);
            renderNotes();
        }
    }

    function deleteNote(id) {
        if (!confirm("Are you sure you want to delete this note?")) return;
        const notes = getNotes().filter(n => n.id !== id);
        saveNotes(notes);
        renderNotes();
    }

    /* Drag & Drop Reordering */
    function handleDragStart(e, index) {
        draggedItemIndex = index;
        e.dataTransfer.effectAllowed = 'move';
        e.currentTarget.classList.add('dragging');
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnd(e) {
        e.currentTarget.classList.remove('dragging');
    }

    function handleDrop(e, targetIndex) {
        e.preventDefault();
        if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;

        const notes = getNotes();
        const [movedItem] = notes.splice(draggedItemIndex, 1);
        notes.splice(targetIndex, 0, movedItem);

        saveNotes(notes);
        draggedItemIndex = null;
        renderNotes();
    }

    /* DOM Rendering */
    function formatDate(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderNotes() {
        const container = document.getElementById("notesList");
        const allNotes = getNotes();

        const filteredNotes = allNotes.filter(note => {
            const matchesSearch = note.text.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  (note.category && note.category.toLowerCase().includes(searchQuery.toLowerCase()));
            if (!matchesSearch) return false;
            if (currentFilter === 'active') return !note.completed;
            if (currentFilter === 'completed') return note.completed;
            return true;
        });

        if (filteredNotes.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <p>No notes found.</p>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Add a note above to get started!</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filteredNotes.map((note, index) => `
            <div class="note-item ${note.completed ? 'completed' : ''}" 
                 draggable="true" 
                 ondragstart="handleDragStart(event, ${index})" 
                 ondragover="handleDragOver(event)" 
                 ondragend="handleDragEnd(event)" 
                 ondrop="handleDrop(event, ${index})">
                <div class="note-header">
                    <span class="note-category-badge">${escapeHtml(note.category || 'General')}</span>
                    <label class="checkbox-label" title="Mark complete/incomplete">
                        <input type="checkbox" ${note.completed ? 'checked' : ''} onchange="toggleComplete(${note.id})">
                        <span style="font-size:0.8rem;">Done</span>
                    </label>
                </div>

                <div class="note-content">${escapeHtml(note.text)}</div>

                <div class="note-footer">
                    <div class="note-timestamps">
                        <span>Created: ${formatDate(note.createdAt)}</span>
                        ${note.updatedAt ? `<span>Updated: ${formatDate(note.updatedAt)}</span>` : ''}
                    </div>
                    <div class="note-actions">
                        <button class="btn-edit" onclick="openEditModal(${note.id})">✏️ Edit</button>
                        <button class="btn-danger" onclick="deleteNote(${note.id})">🗑️ Delete</button>
                    </div>
                </div>
            </div>
        `).join("");
    }

    /* Form & Filter Handlers */
    function handleFormSubmit(e) {
        e.preventDefault();
        const input = document.getElementById("noteInput");
        const category = document.getElementById("categorySelect").value;
        addNote(input.value, category);
        input.value = "";
    }

    function handleSearch() {
        searchQuery = document.getElementById("searchInput").value;
        renderNotes();
    }

    function setFilter(filterType, element) {
        currentFilter = filterType;
        document.querySelectorAll('.tag-pill').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        renderNotes();
    }

    /* Edit Modal */
    function openEditModal(id) {
        const notes = getNotes();
        const note = notes.find(n => n.id === id);
        if (!note) return;

        editingNoteId = id;
        document.getElementById("editModalInput").value = note.text;
        document.getElementById("editModalCategory").value = note.category || 'General';
        document.getElementById("editModal").classList.add("active");
    }

    function closeEditModal() {
        editingNoteId = null;
        document.getElementById("editModal").classList.remove("active");
    }

    function saveEditedNote() {
        const newText = document.getElementById("editModalInput").value;
        const newCat = document.getElementById("editModalCategory").value;
        if (!newText.trim()) return alert("Note text cannot be empty.");
        updateNote(editingNoteId, newText, newCat);
        closeEditModal();
    }

    /* Import / Export */
    function exportNotes() {
        const notes = getNotes();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `notes_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importNotes(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    if (confirm(`Import ${imported.length} notes?`)) {
                        const current = getNotes();
                        const currentIds = new Set(current.map(n => n.id));
                        imported.forEach(item => {
                            if (!currentIds.has(item.id)) current.push(item);
                        });
                        saveNotes(current);
                        renderNotes();
                    }
                } else {
                    alert("Invalid JSON format.");
                }
            } catch (err) {
                alert("Failed to parse JSON file.");
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    /* Dark / Light Mode */
    function initTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        if (savedTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
        } else {
            document.body.removeAttribute('data-theme');
        }
    }

    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        const nextTheme = current === 'light' ? 'dark' : 'light';
        if (nextTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
        } else {
            document.body.removeAttribute('data-theme');
        }
        localStorage.setItem(THEME_KEY, nextTheme);
    }

    /* Init */
    window.addEventListener('DOMContentLoaded', () => {
        initTheme();
        renderNotes();
    });
</script>

</body>
</html>
