<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment 11 - Website with HTML, CSS and JavaScript (AJAX)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h2>WebLearn</h2>
  <nav><a href="#home">Home</a><a href="#courseSection">Courses</a><a href="#contact">Contact</a></nav>
</header>

<div class="hero" id="home">
  <h1>Learn Web Development</h1>
  <p>HTML, CSS, JavaScript and AJAX in one place</p>
  <button id="startBtn">View Courses</button>
</div>

<section id="courseSection">
  <h2>Our Courses (loaded using AJAX)</h2>
  <div id="courses">Loading...</div>
</section>

<section id="contact">
  <h2>Contact Us</h2>
  <form id="contactForm" novalidate>
    <label for="name">Name</label><input type="text" id="name"><div class="error" id="nameErr"></div>
    <label for="email">Email</label><input type="text" id="email"><div class="error" id="emailErr"></div>
    <label for="message">Message</label><textarea id="message" rows="4"></textarea><div class="error" id="msgErr"></div>
    <button type="submit">Send</button>
    <div id="formMsg"></div>
  </form>
</section>

<footer>&copy; <span id="year"></span> WebLearn - Web Programming Lab</footer>
<script src="js/script.js"></script>
</body>
</html>
