<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Experiment 7 - ES6 Concepts</title>
<style>body{font-family:Arial;margin:20px;background:#f4f1fa}pre{background:#2c1a3d;color:#eee;padding:15px;border-radius:8px;white-space:pre-wrap}</style>
</head>
<body>
<h2>ES6 Concepts</h2>
<pre id="out"></pre>
<script type="module">
let log = "";
const print = t => log += t + "\n";

// 1. let and const
let a = 10; const PI = 3.14;
print("1. let/const: a=" + a + ", PI=" + PI);

// 2. Template literals
const name = "Asha";
print(`2. Template literal: Hello ${name}, 2+3=${2+3}`);

// 3. Arrow functions
const add = (x, y) => x + y;
print("3. Arrow function add(4,5)=" + add(4,5));

// 4. Default and rest parameters, spread operator
const greet = (n = "Guest") => `Hi ${n}`;
const sum = (...nums) => nums.reduce((p,c)=>p+c, 0);
print("4. Default: " + greet() + " | Rest sum(1,2,3,4)=" + sum(1,2,3,4));
const arr1 = [1,2,3], arr2 = [...arr1, 4, 5];
print("   Spread: " + arr2);

// 5. Destructuring
const [first, second] = arr2;
const { city, state = "UP" } = { city: "Najibabad" };
print(`5. Destructuring: ${first}, ${second}, ${city}, ${state}`);

// 6. Enhanced object literals
const age = 20;
const person = { name, age, hello() { return "Hello " + this.name; } };
print("6. Object literal: " + person.hello());

// 7. Classes and inheritance
class Animal {
  constructor(name){ this.name = name; }
  speak(){ return `${this.name} makes a sound`; }
}
class Dog extends Animal {
  speak(){ return `${this.name} barks`; }
}
print("7. Class: " + new Animal("Cat").speak() + " | " + new Dog("Tommy").speak());

// 8. Modules (inline demo using dynamic import of a data URL)
const mod = await import("data:text/javascript,export const msg='Module loaded'; export default ()=>42;");
print("8. Modules: " + mod.msg + ", default=" + mod.default());

// 9. Promises and async/await
const delay = ms => new Promise(res => setTimeout(() => res("Promise resolved after " + ms + "ms"), ms));
print("9. " + await delay(500));

// 10. Map, Set, Symbol
const m = new Map([["a",1],["b",2]]); const s = new Set([1,2,2,3,3]);
print("10. Map size=" + m.size + ", Set=" + [...s] + ", Symbol=" + Symbol("id").toString());

// 11. for...of, Array methods
for (const v of [10,20]) print("11. for...of value: " + v);
print("    find: " + [5,12,8].find(x => x > 6) + ", includes: " + [1,2,3].includes(2));

document.getElementById("out").textContent = log;
</script>
</body>
</html>
