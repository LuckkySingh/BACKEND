<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Task Manager</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;padding:30px 16px;background:#0b1120;color:#e2e8f0;font-family:Arial,sans-serif;display:grid;place-items:center}
        .card{width:100%;max-width:500px;padding:30px;background:#151f32;border:1px solid #2b3a50;border-radius:18px}
        h1{margin-top:0;font-size:27px}
        .subtitle{color:#94a3b8;margin-bottom:28px}
        label{display:block;margin:20px 0 9px;font-size:14px;color:#cbd5e1}
        input{width:100%;padding:13px;background:#0b1120;color:white;border:1px solid #34445d;border-radius:9px;font-size:15px}
        input:focus{outline:none;border-color:#60a5fa}
        .errorlist{color:#fca5a5;padding-left:20px;font-size:14px}
        .actions{display:flex;gap:10px;margin-top:25px}
        button,a{padding:12px 16px;border:0;border-radius:9px;text-decoration:none;font-weight:600;cursor:pointer;font-size:14px}
        button{background:#3b82f6;color:white;flex:1}
        a{background:#263449;color:#e2e8f0;text-align:center}
        .help{color:#94a3b8;font-size:12px;margin-top:8px}
    </style>
</head>
<body>
    <main class="card">
        <h1>{{ page_title }}</h1>
        <p class="subtitle">Organize your tasks and deadlines.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="{{ form.title.id_for_label }}">Task title</label>
            {{ form.title }}
            {{ form.title.errors }}

            <label for="{{ form.due_at.id_for_label }}">Deadline</label>
            {{ form.due_at }}
            {{ form.due_at.errors }}

            <p class="help">The deadline is optional. Leave it empty if the task has no deadline.</p>

            <div class="actions">
                <button type="submit">Save Task</button>
                <a href="{% url 'index' %}">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
